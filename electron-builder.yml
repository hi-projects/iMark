appId: com.imarkdown.app
productName: iMark
directories:
  buildResources: build
files:
  - out/**
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  # 本机无符号链接权限(winCodeSign 解压需要管理员/开发者模式)时跳过 rcedit+签名工具链;
  # 启用 Windows 开发者模式后可移除此项以获得自定义图标与 exe 元数据
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: iMark
linux:
  target:
    - AppImage
    - deb
  category: Office
  # deb 的维护者字段会用 package.json 的 author(已含邮箱)
  synopsis: 所见即所得 Markdown 编辑器
  desktop:
    entry:
      Name: iMark
      Comment: 所见即所得 Markdown 编辑器
      Categories: Office;TextEditor;
      # 声明能打开哪些类型,「打开方式」列表里才会出现 iMark;
      # 「设为默认」也是靠这个 ID 走 xdg-mime(见 src/main/system.ts)。
      # text/x-markdown 是 shared-mime-info 里 text/markdown 的别名,留给老工具认。
      MimeType: text/markdown;text/x-markdown;
