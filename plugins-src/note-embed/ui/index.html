<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>笔记引用面板</title>
    <!--
      主题令牌:同源的保留路径(宿主从应用里那一份 tokens.css 直接发出来)。
      它过得了 CSP 的 `style-src 'self'`,**唯一的原因是同源** —— 换成 data:、
      外链 URL 或者别的 scheme 都会被拦掉。想用自己的颜色就写在 style.css 里。

      (preload 已经用 webFrame.insertCSS 注入过同一份,所以这个 <link> 其实可以省;
      写出来是为了让"配色从哪来"这件事在页面上看得见。)
    -->
    <link rel="stylesheet" href="/__imark/ui.css" />
    <link rel="stylesheet" href="/ui/style.css" />
  </head>
  <body>
    <header>
      <input id="filter" type="search" placeholder="筛选文件…" autocomplete="off" />
      <button id="refresh" title="重新读取仓库">刷新</button>
    </header>

    <main>
      <ul id="files"></ul>
      <section id="preview">
        <p class="hint">左边选一篇笔记,这里显示它的开头。</p>
      </section>
    </main>

    <footer>
      <span id="status"></span>
      <button id="insert" disabled>插入到当前文档</button>
    </footer>

    <script type="module" src="/ui/app.js"></script>
  </body>
</html>
