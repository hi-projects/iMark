<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- iMark 应用图标: 圆角渐变底 + 白色 M 字形 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B6BF5"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- M 在自身坐标系里画(高 221, 笔画 46), 再整体缩放居中;
       改大小调 scale 即可, 位移按 墨迹 298x297 居中 反推 -->
  <g transform="translate(-10.1 -96.7) scale(1.3437)" fill="none" stroke="#fff"
     stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
    <path d="M110 350 L110 175 L198 262 L286 175 L286 350"/>
  </g>
</svg>
